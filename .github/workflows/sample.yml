name: Make a sample PDF

# Run from the Actions tab: "Make a sample PDF" > "Run workflow".
# Needs the repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      shop_url:
        description: "Shop home page (Shopify) or one product page URL"
        required: true
      prospect:
        description: "Shop name shown on the PDF"
        required: true
      products:
        description: "Optional: product names to pick, comma separated (else the first ones)"
        required: false
        default: ""
      limit:
        description: "How many products"
        required: false
        default: "5"
      langs:
        description: "Languages, comma separated, main language first"
        required: false
        default: "en,de,fr,nl"

permissions:
  contents: write  # to save results on the "samples" branch

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Generate sample
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOP_URL: ${{ inputs.shop_url }}
          PROSPECT: ${{ inputs.prospect }}
          LIMIT: ${{ inputs.limit }}
          LANGS: ${{ inputs.langs }}
          ONLY: ${{ inputs.products }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p sample
          listwell sample "$SHOP_URL" --prospect "$PROSPECT" --limit "$LIMIT" --langs "$LANGS" --only "$ONLY" --out sample 2>&1 | tee sample/run.log || true
          test -f sample/sample.pdf
      - name: Images for DMs (one PNG per product page)
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pages=$(pdfinfo sample/sample.pdf | awk '/^Pages:/ {print $2}')
          # page 1 is the cover and the last page is the closing page
          pdftoppm -r 150 -png -f 2 -l $((pages - 1)) sample/sample.pdf sample/dm-product
      - name: Save to the samples branch
        if: always()
        env:
          PROSPECT: ${{ inputs.prospect }}
        run: |
          slug=$(echo "$PROSPECT" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//')
          dest="samples/${slug}-run${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git fetch origin samples || true
          if git rev-parse --verify -q origin/samples >/dev/null; then
            git worktree add /tmp/samples origin/samples && (cd /tmp/samples && git checkout -B samples)
          else
            git worktree add --orphan -b samples /tmp/samples
          fi
          mkdir -p "/tmp/samples/$dest"
          cp -r sample/. "/tmp/samples/$dest/"
          cd /tmp/samples
          git add -A
          git commit -m "Sample for $PROSPECT (run ${{ github.run_number }})"
          git push origin samples
          echo "Saved to branch samples, folder $dest"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ github.run_number }}
          path: sample/
          if-no-files-found: warn
